<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <title>Galerija slogov ploščic</title>
  <style>
    body { margin: 0; padding: 16px; background: #e9dfc9; font-family: "Source Sans 3", system-ui, sans-serif; overflow: auto !important; }
    section { margin-bottom: 14px; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .55); }
    h2 { margin: 0 0 6px; font: 700 20px/1.2 "DM Serif Display", Georgia, serif; color: #5a3c22; }
    .vrsta { display: flex; flex-wrap: wrap; gap: 9px 7px; }
    .vrsta .pl { position: relative; display: inline-block; width: 60px; height: 78px; cursor: default; }
  </style>
</head>
<body>
  <div id="g"></div>
  <script type="module">
    import "./src/slog.css";
    import "@fontsource/source-sans-3/latin-700.css";
    import "@fontsource/dm-serif-display/latin-400.css";
    import { VRSTE, SLOGI_PLOSCIC, liceSamostojno } from "./src/art/ploscice.ts";
    document.body.style.overflow = "auto";
    const zoom = new URLSearchParams(location.search).get("zoom"); if (zoom) document.body.style.zoom = zoom;
    const g = document.getElementById("g");
    const izbor = new URLSearchParams(location.search).get("slogi")?.split(",");
    for (const s of SLOGI_PLOSCIC) {
      if (izbor && !izbor.includes(s.id)) continue;
      const sec = document.createElement("section");
      sec.dataset.slog = s.id;
      sec.innerHTML = `<h2>${s.ime}</h2><div class="vrsta">${VRSTE.map(v => `<span class="pl">${liceSamostojno(v.id, s.id)}</span>`).join("")}</div>`;
      g.appendChild(sec);
    }
  </script>
</body>
</html>
